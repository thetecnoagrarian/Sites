# Synthetic ingress only. The applications have no host port bindings.
resolver 127.0.0.11 valid=1s ipv6=off;

map $host $site_upstream {
    default "";
    ffg.nginx-gate.test ffg-gate:4000;
    tta.nginx-gate.test tta-gate:4002;
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name ffg.nginx-gate.test tta.nginx-gate.test;
    ssl_certificate /run/nginx-gate/server.crt;
    ssl_certificate_key /run/nginx-gate/server.key;
    access_log off;

    if ($site_upstream = "") {
        return 421;
    }

    location / {
        # Resolve disposable app endpoints again after the wrong-peer phase.
        proxy_pass http://$site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
    }
}
