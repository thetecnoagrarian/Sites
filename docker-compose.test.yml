services:
  fruitionforestgarden:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod.site
      args:
        SITE_DIR_NAME: fruitionforestgarden
        SITE_PORT: 4000
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ROLE: production
      SESSION_SECRET: ffg-local-test-session-secret-do-not-use-outside-isolated-harness
      DATABASE_PATH: /app/data/blog.db
      UPLOADS_PATH: /app/data/uploads
      BASE_URL: http://127.0.0.1:4000
      LOG_LEVEL: warn
      MAX_FILE_SIZE: 52428800
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      TRUSTED_IPS: "127.0.0.1,::1"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ffg_test_data:/app/data
      - ffg_test_logs:/app/logs
    networks:
      - blog_test_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  ffg-test-fixture:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod.site
      args:
        SITE_DIR_NAME: fruitionforestgarden
        SITE_PORT: 4000
    restart: "no"
    depends_on:
      fruitionforestgarden:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - sqlite3 -bail /app/data/blog.db < /fixtures/local-test-seed.sql
    volumes:
      - ffg_test_data:/app/data
      - ./tests/fixtures/local-test-seed.sql:/fixtures/local-test-seed.sql:ro
    networks:
      - blog_test_network

  thetecnoagrarian:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod.site
      args:
        SITE_DIR_NAME: thetecnoagrarian
        SITE_PORT: 4002
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: 4002
      APP_ROLE: production
      SESSION_SECRET: tta-local-test-session-secret-do-not-use-outside-isolated-harness
      DATABASE_PATH: /app/data/blog.db
      UPLOADS_PATH: /app/data/uploads
      BASE_URL: http://127.0.0.1:4002
      LOG_LEVEL: warn
      MAX_FILE_SIZE: 52428800
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      TRUSTED_IPS: "127.0.0.1,::1"
    ports:
      - "127.0.0.1:4002:4002"
    volumes:
      - tta_test_data:/app/data
      - tta_test_logs:/app/logs
    networks:
      - blog_test_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  tta-test-fixture:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod.site
      args:
        SITE_DIR_NAME: thetecnoagrarian
        SITE_PORT: 4002
    restart: "no"
    depends_on:
      thetecnoagrarian:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - sqlite3 -bail /app/data/blog.db < /fixtures/local-test-seed.sql
    volumes:
      - tta_test_data:/app/data
      - ./tests/fixtures/local-test-seed.sql:/fixtures/local-test-seed.sql:ro
    networks:
      - blog_test_network

volumes:
  ffg_test_data:
    driver: local
  ffg_test_logs:
    driver: local
  tta_test_data:
    driver: local
  tta_test_logs:
    driver: local

networks:
  blog_test_network:
    driver: bridge
