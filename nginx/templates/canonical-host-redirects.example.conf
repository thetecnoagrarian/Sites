# Canonical host redirect template
#
# Purpose:
# - Example-only nginx pattern for redirecting all public variants to the
#   canonical HTTPS www host.
# - Represents the public-safe pattern used after Search Console reported
#   non-www duplicate homepage variants.
#
# Safety:
# - This is not production config.
# - Do not commit real server IP addresses, private usernames, SSH key paths,
#   local machine paths, private operator command history, session cookies,
#   CSRF values, or secret values.
# - Certificate paths below are placeholders only. Do not commit certificate
#   contents or private key material.
#
# Placeholder mapping:
# - example.com: non-www domain
# - www.example.com: canonical HTTPS www domain
# - PORT: local application port or upstream service port

# Redirect both HTTP variants directly to the canonical HTTPS www host.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://www.example.com$request_uri;
}

# Redirect HTTPS non-www to the canonical HTTPS www host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # Placeholder certificate paths. Replace with the correct certificate for
    # the real domain in private/operator-controlled server config.
    ssl_certificate /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    return 301 https://www.example.com$request_uri;
}

# Canonical HTTPS www application proxy.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.com;

    # Placeholder certificate paths. Replace with the correct certificate for
    # the real domain in private/operator-controlled server config.
    ssl_certificate /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Adaptation notes:
# - Replace example.com and www.example.com with the public domain pair.
# - Replace PORT with the app's local upstream port or use a named upstream.
# - Keep the non-www redirect at nginx/edge when nginx already owns host and
#   scheme canonicalization.
# - Do not add private access details to this template.
#
# Search Console note:
# - Redirected URL variants may appear as "Page with redirect". This is expected
#   when the redirect target is the intended canonical URL.
#
# Placeholder verification commands:
#   curl -I http://example.com/
#   curl -I http://www.example.com/
#   curl -I https://example.com/
#   curl -I https://www.example.com/
#
# Expected:
# - http://example.com/ redirects to https://www.example.com/
# - http://www.example.com/ redirects to https://www.example.com/
# - https://example.com/ redirects to https://www.example.com/
# - https://www.example.com/ returns the application response.
